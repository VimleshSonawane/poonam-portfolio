<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shortlist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A44;--soft:#5D6680;--rule:#E4E7EF;--rose:#B5577D;--grad:linear-gradient(120deg,#6C8CFF,#B58CFF 45%,#FF9EC4 80%,#FFC48C)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:480px;height:480px;background:#E3E9FF;top:-120px;left:-100px}
.bg i:nth-child(2){width:420px;height:420px;background:#F6E6FF;bottom:-140px;right:-120px;animation-duration:28s}
.bg i:nth-child(3){width:340px;height:340px;background:#FFE6EE;top:40%;left:55%;animation-duration:34s}
@keyframes drift{to{transform:translate(50px,60px) scale(1.1)}}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.55}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}

.stack{width:min(400px,100%);display:grid;gap:16px}
.card{background:rgba(255,255,255,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--rule);border-radius:22px;padding:34px 30px 30px;box-shadow:0 2px 4px rgba(31,42,68,.04),0 24px 60px rgba(181,140,255,.18);animation:cardIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.brand{font:600 30px "Newsreader",Georgia,serif;margin:0 0 4px;background:var(--grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
@keyframes shimmer{to{background-position:220% 0}}
.sub{color:var(--soft);margin:0 0 22px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.field{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;font:16px "Instrument Sans",system-ui,sans-serif;color:var(--ink);background:#fff}
.field:focus{outline:none;border-color:#D7A6FF;box-shadow:0 0 0 4px rgba(181,140,255,.18)}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;font:600 16px "Instrument Sans",system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#7A4FD6,#C2578E);box-shadow:0 8px 20px rgba(160,80,160,.28);cursor:pointer}

/* ---------- the note ---------- */
.note{margin:28px 0 0;text-align:center;color:var(--rose)}
.note .w{display:inline-block;opacity:0;transform:translateY(12px);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
.because{font:italic 400 19px "Newsreader",Georgia,serif;letter-spacing:.02em;color:#C48AA6}
.name{display:block;margin:2px 0 4px;font:500 clamp(44px,12vw,58px)/1.05 "Newsreader",Georgia,serif;letter-spacing:-.01em;
  background:linear-gradient(110deg,#FF7AA8 0%,#C38CFF 30%,#7C9CFF 50%,#C38CFF 70%,#FF7AA8 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(255,122,168,.25))}
.note .name{display:block}
.loved{white-space:nowrap}
.name.w{animation:up .9s cubic-bezier(.2,.8,.2,1) forwards,shimmer 6s linear infinite}
.loved{font:italic 400 24px "Newsreader",Georgia,serif}
.always{position:relative;display:inline-block;margin-top:10px;font:600 40px/1 "Caveat","Segoe Script","Bradley Hand",cursive;color:#D0507F}
.always .heart{display:inline-block;width:.72em;height:.72em;margin:0 .02em;vertical-align:-.04em;animation:beat 1.4s ease-in-out 3s infinite;transform-origin:50% 60%}
.always .heart path{fill:#FF5C8F}
.always svg.line{position:absolute;left:-6%;right:-6%;bottom:-12px;width:112%;height:14px;overflow:visible}
.always svg.line path{fill:none;stroke:#FF9EC4;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.6s ease-out 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.16)}}

/* ---------- our tune ---------- */
.tune{display:flex;align-items:center;justify-content:center;gap:10px;width:auto;margin:22px auto 0;padding:10px 18px 10px 14px;border:1px solid #F6CADB;border-radius:999px;background:#FFF5F9;color:#C2578E;box-shadow:none;font:italic 400 17px "Newsreader",Georgia,serif;opacity:0;animation:up .8s ease 3.2s forwards}
.tune svg{width:22px;height:22px}
.tune svg path{fill:#FF7AA8}
.tune[aria-pressed="true"] svg{animation:beat 1.1s ease-in-out infinite}
.tune:hover{background:#FFEDF4}
.sparkle{position:fixed;pointer-events:none;font-size:14px;color:#FF9EC4;animation:pop 1.6s ease-out forwards}
@keyframes pop{from{opacity:.9;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-70px) scale(1.2)}}

/* ---------- song ---------- */
.song{border-radius:16px;overflow:hidden;box-shadow:0 18px 44px rgba(31,42,68,.14);opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) 3.4s forwards;transform:translateY(12px)}
.song iframe{display:block;width:100%;height:152px;border:0}
.songnote{margin:-6px 0 0;text-align:center;font:italic 400 14px "Newsreader",Georgia,serif;color:#B48AA0;opacity:0;animation:up .8s ease 3.8s forwards}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.note .w,.song,.songnote{opacity:1;transform:none}.always svg.line path{stroke-dashoffset:0}}
</style></head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="hearts" id="hearts"></div>
<div class="stack">
  <main class="card">
    <h1 class="brand">Shortlist</h1>
    <p class="sub">Sign in to continue.</p>
    <label for="u">Username</label><input class="field" id="u" type="text" autocomplete="off">
    <label for="p">Password</label><input class="field" id="p" type="password" autocomplete="new-password">
    <button type="button">Sign in</button>
    <p class="note" aria-label="Because Dimpoo, you are loved. Always.">
      <span class="w because" style="animation-delay:.5s">because</span>
      <span class="w name" style="animation-delay:.9s,0s">Dimpoo</span>
      <span class="w loved" style="animation-delay:1.6s">you</span>
      <span class="w loved" style="animation-delay:1.8s">are</span>
      <span class="w loved" style="animation-delay:2s">loved</span><br>
      <span class="w always" style="animation-delay:2.4s" aria-hidden="true">alw<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 4.4 2.5h1.6c.8-1.3 2.3-2.5 4.4-2.5 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>ys<svg class="line" viewBox="0 0 200 14" preserveAspectRatio="none"><path d="M4 9 C 40 2, 80 13, 120 6 S 180 4, 196 8"/></svg></span>
    </p>
    <button class="tune" id="tune" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 4.4 2.5h1.6c.8-1.3 2.3-2.5 4.4-2.5 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg><span id="tuneLabel">play our tune</span></button>
  </main>
  <div class="song"><iframe title="Unforgettable by Talwiinder on Spotify" src="https://open.spotify.com/embed/track/4rHZZAmHpZrA3iH5zx8frV?utm_source=generator" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
  <p class="songnote">press play</p>
</div>
<script>
/* Our tune: an original music-box waltz, played by the browser. No audio file. */
(function(){
  // [note, beats] in 3/4. Original melody written for this page.
  var M=[["E5",1],["G5",1],["C6",1],["B5",2],["G5",1],["A5",1],["F5",1],["A5",1],["G5",3],
         ["E5",1],["G5",1],["C6",1],["D6",2],["C6",1],["B5",1],["A5",1],["B5",1],["C6",3],
         ["A5",1],["C6",1],["F6",1],["E6",2],["D6",1],["C6",1],["A5",1],["G5",1],["E5",3],
         ["F5",1],["A5",1],["D6",1],["C6",2],["B5",1],["D6",1],["B5",1],["G5",1],["C6",3]];
  var BASS=["C3","G2","F2","G2","C3","G2","G2","C3","F2","C3","F2","C3","D3","A2","G2","C3"];
  var FIFTH={"C3":"G3","G2":"D3","F2":"C3","D3":"A3","A2":"E3"};
  var N={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  var hz=function(n){ var m=12*(Number(n.slice(-1))+1)+N[n[0]]; return 440*Math.pow(2,(m-69)/12); };
  var BEAT=60/84, ctx=null, out=null, playing=false, timer=null, next=0, step=0;
  function voice(f,t,gain,len){
    [[1,1],[2,.32],[3,.12],[4.2,.05]].forEach(function(h){ // music-box partials
      var o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=f*h[0];
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain*h[1],t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+len/(h[0]*.6+.4));
      o.connect(g); g.connect(out); o.start(t); o.stop(t+len+.1); });
  }
  function sparkle(){ var b=document.getElementById("tune").getBoundingClientRect(), s=document.createElement("span"); s.className="sparkle"; s.textContent=Math.random()<.5?"♥":"✦";
    s.style.left=(b.left+Math.random()*b.width)+"px"; s.style.top=(b.top-6)+"px"; document.body.appendChild(s); setTimeout(function(){s.remove();},1700); }
  function schedule(){
    while(next<ctx.currentTime+.25){
      var beatInPiece=0; for(var i=0;i<step%M.length;i++) beatInPiece+=M[i][1];
      var n=M[step%M.length];
      if(beatInPiece%3===0){ var bar=Math.floor(beatInPiece/3)%16, r=BASS[bar]; voice(hz(r),next,.16,2.6); voice(hz(FIFTH[r]),next+BEAT,.07,1.6); }
      voice(hz(n[0]),next,.22,n[1]*BEAT*1.8+.8);
      (function(d){ setTimeout(function(){ if(playing) sparkle(); },Math.max(0,d*1000)); })(next-ctx.currentTime);
      next+=n[1]*BEAT; step++;
    }
  }
  function start(){
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(!out){ out=ctx.createGain(); out.gain.value=.55; var d=ctx.createDelay(), fb=ctx.createGain(), wet=ctx.createGain(); d.delayTime.value=.23; fb.gain.value=.28; wet.gain.value=.25;
      out.connect(ctx.destination); out.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(ctx.destination); }
    ctx.resume(); playing=true; step=0; next=ctx.currentTime+.08; schedule(); timer=setInterval(schedule,90);
  }
  function stop(){ playing=false; clearInterval(timer); if(out){ out.gain.setTargetAtTime(0,ctx.currentTime,.15); var o=out; out=null; setTimeout(function(){ o.disconnect(); },900); } }
  var btn=document.getElementById("tune");
  btn.addEventListener("click",function(){ if(playing){ stop(); btn.setAttribute("aria-pressed","false"); document.getElementById("tuneLabel").textContent="play our tune"; }
    else { start(); btn.setAttribute("aria-pressed","true"); document.getElementById("tuneLabel").textContent="our tune"; } });
})();
(function(){
  var h=document.getElementById("hearts"), sym=["♥","♡","✦","♥"];
  for(var i=0;i<18;i++){ var s=document.createElement("span"); s.textContent=sym[i%4]; s.style.left=(Math.random()*100)+"vw"; s.style.color=["#FF9EC4","#C38CFF","#9DB0FF","#FF7AA8"][i%4]; s.style.fontSize=(12+Math.random()*18)+"px"; s.style.animationDuration=(10+Math.random()*12)+"s"; s.style.animationDelay=(Math.random()*10)+"s"; h.appendChild(s); }
})();
</script>
</body></html>
